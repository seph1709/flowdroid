name: phone_bridge
description: FlowDroid's Android glue for phone triggers (SMS, notifications, phone events, Quick Settings tile, sharing, shortcuts) and documents.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.flowdroid.phone_bridge
        pluginClass: PhoneBridgePlugin
