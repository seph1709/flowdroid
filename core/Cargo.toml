# Workspace for the Rust crates. `flowcore` (the rust-anything bridge crate)
# stays outside it, because rust-anything builds and gates it on its own.
[workspace]
resolver = "3"
members = ["flowcore-engine", "flowcore-ffi"]
exclude = ["flowcore"]

# Small, stripped binaries for the phone; panics unwind so the FFI layer can catch them.
[profile.release]
lto = true
opt-level = "s"
strip = true
codegen-units = 1
