name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Engine, port proof and app tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: engine-ts

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            core/flowcore
      - name: Install rust-anything
        run: cargo install --locked rust-anything

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned so `dart format` in CI matches what developers run.
          flutter-version: 3.50.1

      - run: make ts-test core-lint core-test
      - name: Prove the Rust port matches the TypeScript reference
        run: make port-verify
      - run: make app-lint app-test

  apk:
    name: Android APK
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo install --locked cargo-ndk
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned so `dart format` in CI matches what developers run.
          flutter-version: 3.50.1
      - run: make apk
      - uses: actions/upload-artifact@v4
        with:
          name: flowdroid-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
